server: "http://cairn-server:8000"

common_env:
  TSEC_SERVER_HOST: "127.0.0.1:8000"
  TSEC_AGENT_TOKEN: "replace-me"

runtime:
  interval: 3
  max_workers: 8
  max_running_projects: 3
  max_project_workers: 4
  healthcheck_timeout: 20
  prompt_group: "default"

tasks:
  bootstrap:
    timeout: 300
    conclude_timeout: 90
  reason:
    timeout: 300
    max_intents: 2
  explore:
    timeout: 300
    conclude_timeout: 90

container:
  image: "ghcr.io/oritera/cairn-worker-container:latest"
  platform: "linux/amd64"
  network_mode: "host"
  completed_action: "stop"
  # cap_add:
  #   - "NET_RAW"
  #   - "NET_ADMIN"

workers:
  - name: "codex-example"
    type: "codex"
    task_types: [bootstrap, reason, explore]
    max_running: 2
    priority: 0
    env:
      CODEX_MODEL: "your-model-name"
      CODEX_BASE_URL: "https://your-openai-compatible-endpoint/v1"
      # Set to "true" if your Responses API endpoint rejects non-streaming requests.
      CODEX_HEALTHCHECK_STREAM: "false"
      OPENAI_API_KEY: "sk-replace-me"
